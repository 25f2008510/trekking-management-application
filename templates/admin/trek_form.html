{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ 'Edit Trek' if trek else 'Add New Trek' }}</h2>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control" required value="{{ trek.name if trek else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required value="{{ trek.location if trek else '' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select" required>
                    {% for level in ['Easy', 'Moderate', 'Hard'] %}
                    <option value="{{ level }}" {% if trek and trek.difficulty == level %}selected{% endif %}>{{ level }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Duration (days)</label>
                <input type="number" name="duration" min="1" class="form-control" required value="{{ trek.duration if trek else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Total Slots</label>
                <input type="number" name="total_slots" min="1" class="form-control" required value="{{ trek.total_slots if trek else '' }}">
            </div>

            {% if trek %}
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                    <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="col-md-4">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" required
                       value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" required
                       value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}">
            </div>

            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">{{ 'Update Trek' if trek else 'Create Trek' }}</button>
            <a href="{{ url_for('admin.treks') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
